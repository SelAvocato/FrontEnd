<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>User Card</title>
    <link rel="stylesheet" href="./usercard.css">
</head>

<body>
    <main class="card">
        <div class="left-side">
            <i class="fa-solid fa-user img"></i>
        </div>
        <div class="right-side">
            <div class="header">
                <p class="name">David Grant</p>
                <p class="title">3D Artist</p>
            </div>
            <div class="scores">
                <div class="rating">
                    <i class="fa-regular fa-star"></i>
                    <span>4.7 Rating</span>
                </div>
                <div class="reviews">
                    <i class="fa-solid fa-award"></i>
                    <span>4,4447 Reviews</span>
                </div>
                <div class="student">
                    <i class="fa-regular fa-user"></i>
                    <span>478 Students</span>
                </div>
            </div>
            <p class="details">David Grant has been making video
                games for a living for more than 14
                years as a Designer, Producer,
                Creative Director, and Executive
                Producer, creating games for
                console, mobile, PC and Facebook.</p>
            <button>Show more</button>
        </div>
    </main>
</body>

</html>
