<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="./color-palette-generator.css">
</head>

<body>
    <main>
        <p class="popup hidden">Color <span class="copied-color">#F9ACA7</span> copied to your clipboard</p>
        <p class="header">Color palette generator</p>
        <div class="color-card-wrapper">
            <div class="color-card">
                <div class="color"></div>
                <p class="detail">#EEEDF0</p>
            </div>
            <div class="color-card">
                <div class="color"></div>
                <p class="detail">#A1B5C1</p>
            </div>
            <div class="color-card">
                <div class="color"></div>
                <p class="detail">#F9ACA7</p>
            </div>
            <div class="color-card">
                <div class="color"></div>
                <p class="detail">#68747D</p>
            </div>
            <div class="color-card">
                <div class="color"></div>
                <p class="detail">#CF365F</p>
            </div>
        </div>
        <div class="generate">
            <button class="generate-btn">Generate palette</button>
            <p class="generate-instruction">Or just press the "Spacebar" to generate new palettes.</p>
        </div>
        <div class="footer">
            <p class="copy-instruction">Click to copy individual color • Press "C" to copy palette.</p>
        </div>
    </main>

    <script src="./color-palette-generator.js"></script>
</body>

</html>
