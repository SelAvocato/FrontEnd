<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
        <link rel="stylesheet" href="./sound-settings.css">
    <title>Sound Settings</title>
</head>

<body>
    <main>
        <header>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                <!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                <path
                    d="M201.4 297.4C188.9 309.9 188.9 330.2 201.4 342.7L361.4 502.7C373.9 515.2 394.2 515.2 406.7 502.7C419.2 490.2 419.2 469.9 406.7 457.4L269.3 320L406.6 182.6C419.1 170.1 419.1 149.8 406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3L201.3 297.3z" />
            </svg>
            <p class="header text">SOUND SETTINGS</p>
        </header>
        <div class="main-body">
            <div class="volume-container">
                <div class="ring-container">
                    <p class="ring text">Ring Volume</p>
                    <div class="ring bar-container">
                        <div class="ring progress" id="ringProgress"></div>
                    </div>
                </div>
                <div class="alarm-container">
                    <p class="alarm text">Alarm Volume</p>
                    <div class="alarm bar-container">
                        <div class="alarm progress" id="alarmProgress"></div>
                    </div>
                </div>
            </div>
            <div class="vibrate-container">
                <p class="vibrate text">Vibrate on ring</p>
                <label class="switch-container">
                    <input id="vibrate-switch" type="checkbox">
                    <div class="thumb"></div>
                </label>
            </div>
            <div class="others">
                <div class="ringtone-container">
                    <p class="ringtone text">Ringtone</p>
                    <div class="ringtone notif-sound">
                        <p class="notif-sound text">Playtime</p>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                            <!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                            <path
                                d="M439.1 297.4C451.6 309.9 451.6 330.2 439.1 342.7L279.1 502.7C266.6 515.2 246.3 515.2 233.8 502.7C221.3 490.2 221.3 469.9 233.8 457.4L371.2 320L233.9 182.6C221.4 170.1 221.4 149.8 233.9 137.3C246.4 124.8 266.7 124.8 279.2 137.3L439.2 297.3z" />
                        </svg>
                    </div>
                </div>
                <div class="message-container">
                    <p class="message text">Message</p>
                    <div class="message notif-sound">
                        <p class="notif-sound text">Bamboo</p>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                            <!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                            <path
                                d="M439.1 297.4C451.6 309.9 451.6 330.2 439.1 342.7L279.1 502.7C266.6 515.2 246.3 515.2 233.8 502.7C221.3 490.2 221.3 469.9 233.8 457.4L371.2 320L233.9 182.6C221.4 170.1 221.4 149.8 233.9 137.3C246.4 124.8 266.7 124.8 279.2 137.3L439.2 297.3z" />
                        </svg>
                    </div>
                </div>
                <div class="notification-container">
                    <p class="notification text">Notifications</p>
                    <div class="notification notif-sound">
                        <p class="notif-sound text">Tri-tone</p>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                            <!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                            <path
                                d="M439.1 297.4C451.6 309.9 451.6 330.2 439.1 342.7L279.1 502.7C266.6 515.2 246.3 515.2 233.8 502.7C221.3 490.2 221.3 469.9 233.8 457.4L371.2 320L233.9 182.6C221.4 170.1 221.4 149.8 233.9 137.3C246.4 124.8 266.7 124.8 279.2 137.3L439.2 297.3z" />
                        </svg>
                    </div>
                </div>
            </div>
            <div class="buttons-container">
                <button id="cancel">Cancel</button>
                <button id="save">Save</button>
            </div>
        </div>
    </main>

    <script src="./sound-settings.js"></script>
</body>

</html>
